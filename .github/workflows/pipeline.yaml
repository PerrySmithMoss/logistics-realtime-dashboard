name: Monorepo Pipeline

on:
  workflow_dispatch:
    inputs:
      rollback_digest:
        description: Previously verified sha256 digest (leave both fields blank for a fresh build)
        type: string
      rollback_revision:
        description: Commit SHA associated with the rollback digest
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-rollback-inputs:
    name: Validate rollback inputs
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_digest != '' || inputs.rollback_revision != '')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a valid digest and revision together
        shell: bash
        env:
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
        run: |
          if [[ ! "$ROLLBACK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || ! "$ROLLBACK_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Provide both a sha256 digest and its 40-character commit SHA."
            exit 1
          fi

  changes:
    name: Detect API changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/**'
              - 'docker-stack.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/**'

  build-api-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --target runner -t fleet-api-test -f apps/server/Dockerfile .
      - name: Verify the runtime starts without build tools
        run: |
          container=$(docker run -d -e NODE_ENV=test -e HOST=0.0.0.0 fleet-api-test)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker exec "$container" node -e 'const { spawnSync } = require("node:child_process"); if (process.getuid() === 0 || ["npm", "pnpm", "yarn"].some(command => spawnSync(command).error?.code !== "ENOENT")) process.exitCode = 1;'
          for attempt in $(seq 1 40); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")
            case "$health" in
              healthy) exit 0 ;;
              starting) sleep 1 ;;
              *) break ;;
            esac
          done
          echo "Fleet container did not become healthy (status: ${health:-missing})" >&2
          docker logs "$container" >&2
          exit 1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Validate
        run: pnpm validate

  e2e:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_PUBLIC_NODE_ENV: test
      FLEET_API_INTERNAL_KEY: test_internal_key_placeholder
      SESSION_SIGNING_SECRET: test_session_secret_32_characters_long
      FLEET_STREAM_SIGNING_SECRET: test_stream_secret_32_characters_long
      FLEET_API_BASE_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_FLEET_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: "pnpm" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E with runner Chrome
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          google-chrome --version
          pnpm turbo run test:e2e --filter=client

  build-and-push-image:
    name: Publish and scan API image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: |
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      inputs.rollback_digest == '' && inputs.rollback_revision == '' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true')
    needs: [e2e, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and Git tag.
      packages: write # Push the API image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the release image before updating latest
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository@$RELEASE_DIGEST"
          scanner=aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          docker pull "$image"
          docker save -o "$RUNNER_TEMP/release.tar" "$image"
          mkdir -p "$RUNNER_TEMP/image-scan"
          docker run --rm -v trivy-cache:/root/.cache/trivy -v "$RUNNER_TEMP/release.tar:/image.tar:ro" -v "$RUNNER_TEMP/image-scan:/reports" "$scanner" image --input /image.tar --scanners vuln --format json --output /reports/api.json
          docker run --rm -v trivy-cache:/root/.cache/trivy -v "$RUNNER_TEMP/release.tar:/image.tar:ro" "$scanner" image --input /image.tar --scanners vuln --ignore-unfixed --exit-code 1
          docker buildx imagetools create --prefer-index=false --tag "$repository:latest" "$image"

      - name: Upload full release scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-vulnerabilities
          path: ${{ runner.temp }}/image-scan

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.$GITHUB_RUN_NUMBER"
          notes=$(printf 'Automated release for commit %s\nImage: ghcr.io/%s:%s' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Release $tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Release $tag" --notes "$notes"
          fi

  deploy:
    name: Deploy API
    needs: [build-and-push-image, validate-rollback-inputs]
    if: |
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.build-and-push-image.result == 'success' ||
       (needs.build-and-push-image.result == 'skipped' && needs.validate-rollback-inputs.result == 'success'))
    environment: VPS Production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Release verified image through restricted SSH
        shell: bash
        env:
          RELEASE_DIGEST: ${{ inputs.rollback_digest || needs.build-and-push-image.outputs.digest }}
          RELEASE_REVISION: ${{ inputs.rollback_revision || github.sha }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          APP_RELEASE_KEY: ${{ secrets.APP_RELEASE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ -n "$VPS_KNOWN_HOSTS" && -n "$APP_RELEASE_KEY" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$APP_RELEASE_KEY" > "$ssh_dir/key"
          unset APP_RELEASE_KEY
          ssh -F /dev/null -nT -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null "fleet-release@$VPS_HOST" \
            "release $RELEASE_DIGEST $RELEASE_REVISION"

      - name: Verify application endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if (
              curl --fail --silent --show-error --max-time 10 --output /dev/null https://fleet-api.perrysmithmoss.com/health/ready
            ); then
              exit 0
            fi
            sleep 5
          done
          exit 1

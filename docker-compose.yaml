services:
  api:
    container_name: fleet-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-development}
    ports:
      - "127.0.0.1:5570:5570"
    env_file:
      - ./apps/server/.env.local
    environment:
      - NODE_ENV=development
      - PORT=5570
      - HOST=0.0.0.0
      - MIN_LOG_LEVEL=DEBUG
      - ENABLE_FLEET_SIMULATOR=true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5570/health/ready').then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
    networks:
      - fleet-network
    volumes:
      - ./apps/server/src:/app/apps/server/src:ro
      - ./packages/common/src:/app/packages/common/src:ro

  client:
    container_name: fleet-client
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    ports:
      - "127.0.0.1:${FLEET_CLIENT_PORT:-3000}:3000"
    env_file:
      - ./apps/client/.env.local
    environment:
      - NODE_ENV=development
      - FLEET_API_BASE_URL=http://api:5570
      - NEXT_PUBLIC_FLEET_API_BASE_URL=http://localhost:5570
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fleet-network
    volumes:
      - ./apps/client/src:/app/apps/client/src:ro
      - ./apps/client/public:/app/apps/client/public:ro
      - ./packages/common/src:/app/packages/common/src:ro

networks:
  fleet-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
